        resetDirectionButton();

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position){


            var userLat =
            position.coords.latitude;


            var userLng =
            position.coords.longitude;


            drawWalkingRoute(
                userLat,
                userLng,
                lat,
                lng
            );

        function(){

            alert(

        }

    );

}

function decodePolyline(encoded){

    var coordinates = [];

    var index = 0;
    var lat = 0;
    var lng = 0;


    while(index < encoded.length){

        var b;
        var shift = 0;
        var result = 0;


        do {

            b = encoded.charCodeAt(index++) - 63;

            result |= (b & 0x1f) << shift;

            shift += 5;

        } while(b >= 0x20);


        var dlat =
        ((result & 1)
        ? ~(result >> 1)
        : (result >> 1));


        lat += dlat;


        shift = 0;
        result = 0;


        do {

            b = encoded.charCodeAt(index++) - 63;

            result |= (b & 0x1f) << shift;

            shift += 5;

        } while(b >= 0x20);


        var dlng =
        ((result & 1)
        ? ~(result >> 1)
        : (result >> 1));


        lng += dlng;


        coordinates.push([
            lat / 1e6,
            lng / 1e6
        ]);

    }


    return coordinates;

}

async function drawWalkingRoute(
    userLat,
    userLng,
    spotLat,
    spotLng
){

    try{


        var request = {

            locations:[

                {
                    lat:userLat,
                    lon:userLng
                },

                {
                    lat:spotLat,
                    lon:spotLng
                }

            ],

            costing:"pedestrian",

            units:"kilometers"

        };


        var response = await fetch(

            "https://valhalla1.openstreetmap.de/route?json="
            +
            encodeURIComponent(
                JSON.stringify(request)
            )

        );


        var data = await response.json();


        var trip = data.trip;


        var route =
        decodePolyline(
            trip.legs[0].shape
        );


        if(walkingRoute){

            map.removeLayer(walkingRoute);

        }


        walkingRoute = L.polyline(

            route,

            {

                color:"#f5c542",

                weight:5,

                opacity:0.9

            }

        );


        walkingRoute.addTo(map);


        map.fitBounds(
            walkingRoute.getBounds()
        );



        var distance =
        trip.summary.length.toFixed(2);


        var minutes =
        Math.round(
            trip.summary.time / 60
        );


        document.getElementById("walkingInfo").innerHTML =

        `

        <hr>

        <h3>Walking Directions</h3>


        <p>
        🚶 Time:
        <b>${minutes} minutes</b>
        </p>

        📏 Distance:
        <b>${distance} km</b>
        </p>

        `;

        resetDirectionButton();



    }


    catch(error){

    console.log(
        "Walking route error:",
        error
    );

    resetDirectionButton();

}

}

function getSunBearing(date, lat, lng){

    var sun = SunCalc.getPosition(
        date,
        lat,
        lng
    );


    var bearing = sun.azimuth * 180 / Math.PI;


    bearing += 180;


    if(bearing >=360){
        bearing -=360;
    }


    return bearing;

}

function getRunwayInUse(){

    if(!airport || !airport.runways || !weather){

        return "Unknown";

    }


    var windDirection = weather.windDirection;


    var bestRunway = null;

    var smallestDifference = 999;



    airport.runways.forEach(function(runway){


        var runwayOptions = [
            {
                name: runway.name.split("/")[0],
                heading: runway.heading1
            },

            {
                name: runway.name.split("/")[1],
                heading: runway.heading2
            }
        ];



        runwayOptions.forEach(function(option){


            var diff = Math.abs(
                windDirection - option.heading
            );


            if(diff > 180){

                diff = 360 - diff;

            }



            if(diff < smallestDifference){

                smallestDifference = diff;

                bestRunway = option.name;

            }


        });


    });


    return bestRunway || "Unknown";

}

function getLightingRating(
    sunBearing,
    cameraBearing,
    sunAltitude,
    cloudCover,
    lowCloud,
    midCloud,
    highCloud
){

    // 🌙 Night
    if(sunAltitude < -6){

        return {
            emoji:"⚫",
            stars:"☆☆☆☆☆",
            text:"Night",
            score:0
        };

    }


    // 🌅 Twilight / very low light
    if(sunAltitude >= -6 && sunAltitude <= 5){

        return {
            emoji:"🔵",
            stars:"★★☆☆☆",
            text:"Low light",
            score:30
        };

    }


    // Make sure cloud values are numbers

    lowCloud = Number(lowCloud) || 0;
    midCloud = Number(midCloud) || 0;
    highCloud = Number(highCloud) || 0;


    /*
        DETERMINE WHETHER CLOUDS ARE BLOCKING
        DIRECT SUNLIGHT
    */


    var heavyOvercast =
        lowCloud >= 80
        ||
        (lowCloud >= 60 && midCloud >= 70);


    /*
        HEAVY OVERCAST

        Direction of the sun doesn't matter much
        because the sunlight is being scattered
        by the cloud layer.

        Therefore every spotting location gets
        the same basic lighting condition.
    */


    if(heavyOvercast){

        return {
            emoji:"☁️",
            stars:"★★★☆☆",
            text:"Overcast",
            score:50
        };

    }


    /*
        CALCULATE SUN DIRECTION

        From here down, direct sunlight is still
        potentially reaching the ground.
    */


    let difference = Math.abs(
        sunBearing - cameraBearing
    );


    if(difference > 180){

        difference = 360 - difference;

    }


    /*
        SUN ALTITUDE BONUS
    */

    let altitudeBonus = 0;


    if(sunAltitude > 5 && sunAltitude < 20){

        altitudeBonus = 20;

    }


    if(sunAltitude >= 20 && sunAltitude < 45){

        altitudeBonus = 10;

    }


    /*
        PARTLY CLOUDY

        There is enough cloud to soften or
        interrupt sunlight, but not enough to
        completely remove directional light.
    */


    var partlyCloudy =
        lowCloud >= 40
        ||
        midCloud >= 70;


    if(partlyCloudy){

        if(difference <= 45){

            return {
                emoji:"⛅",
                stars:"★★★★☆",
                text:"Favourable light",
                score:75 + altitudeBonus
            };

        }


        if(difference <= 110){

            return {
                emoji:"⛅",
                stars:"★★★☆☆",
                text:"Diffused light",
                score:55 + altitudeBonus
            };

        }


        return {
            emoji:"⛅",
            stars:"★★☆☆☆",
            text:"Poor light",
            score:35 + altitudeBonus
        };

    }


    /*
        HIGH CLOUD

        High cloud usually doesn't eliminate
        directional sunlight.

        Therefore the sun direction still matters.
    */


    if(highCloud >= 70){

        if(difference <= 45){

            return {
                emoji:"🌤️",
                stars:"★★★★☆",
                text:"Filtered sunlight",
                score:80 + altitudeBonus
            };

        }


        if(difference <= 110){

            return {
                emoji:"🌤️",
                stars:"★★★☆☆",
                text:"Soft light",
                score:60 + altitudeBonus
            };

        }


        return {
            emoji:"🌤️",
            stars:"★★☆☆☆",
            text:"Poor light",
            score:35 + altitudeBonus
        };

    }


    /*
        CLEAR SKY

        Normal directional lighting system.
    */


    if(difference <= 45){

        return {
            emoji:"🟢",
            stars:"★★★★★",
            text:"Excellent",
            score:100 + altitudeBonus
        };

    }


    if(difference <= 110){

        return {
            emoji:"🟡",
            stars:"★★★☆☆",
            text:"Side lighting",
            score:60 + altitudeBonus
        };

    }


    return {
        emoji:"🔴",
        stars:"★☆☆☆☆",
        text:"Backlit",
        score:20 + altitudeBonus
    };

}

    var date = new Date();

    var slider = document.getElementById("sunTimeSlider");

    if(slider){

        date.setHours(
            parseInt(slider.value)
        );

    var sunBearing = getSunBearing(
        date,
        airport.lat,
        airport.lng
    );

    var sun = SunCalc.getPosition(
    date,
    airport.lat,
    airport.lng
);


var sunAltitude =
sun.altitude * 180 / Math.PI;

    spots.forEach(function(spot){

    spot.lighting = getLightingRating(
        sunBearing,
        spot.direction,
        sunAltitude,
        weather.cloudCover,
        weather.lowCloud,

    );

});

async function updateWeather(){

    if (!airport) {
    return;
}

    try{

        var url =
        "https://api.open-meteo.com/v1/forecast"
        + "?latitude=" + airport.lat
        + "&longitude=" + airport.lng
        + "&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high";


        var response = await fetch(url);


        if(!response.ok){

            throw new Error("Weather API failed");

        }


        var data = await response.json();


        weather.temperature =
            data.current.temperature_2m;


        weather.windSpeed =
            data.current.wind_speed_10m;


        weather.windDirection =
            data.current.wind_direction_10m;


        weather.cloudCover =
            data.current.cloud_cover;

        weather.lowCloud =
            data.current.cloud_cover_low;
            
        weather.midCloud =
            data.current.cloud_cover_mid;

        weather.highCloud =
            data.current.cloud_cover_high;


        weather.description =
            getWeatherDescription(
                data.current.weather_code
            );


        console.log("Weather updated:", weather);


    }

    catch(error){

        console.log("Weather error:", error);

        weather.description = "Weather unavailable";

    }

}

function getWeatherDescription(code){

    switch(code){

        case 0:
            return "Clear";

        case 1:
        case 2:
            return "Mostly Sunny";

        case 3:
            return "Cloudy";

        case 45:
        case 48:
            return "Fog";

        case 61:
        case 63:
        case 65:
            return "Rain";

        default:
            return "Unknown";

    }

}

function getPhotographyScore(){

    var now = new Date();


    var times = SunCalc.getTimes(
        now,
        airport.lat,
        airport.lng
    );


    // Night time
    if(now > times.dusk || now < times.dawn){

        return "☆☆☆☆☆ Night - no photography light";

    }



    var score = 5;



    // Wind penalty
    if(weather.windSpeed > 30){

        score--;

    }



    // Cloud penalty
    if(weather.cloudCover > 80){

        score--;

    }



    // Rain penalty
    if(weather.description === "Rain"){

        score -= 2;

    }



    if(score < 1){

        score = 1;

    }



    var stars = "";


    for(var i = 0; i < score; i++){

        stars += "★";

    }


    for(var i = score; i < 5; i++){

        stars += "☆";

    }


    return stars + " Photography conditions";

}

var compass = document.getElementById("sunCompassOverlay");

var dragging = false;
var offsetX = 0;
var offsetY = 0;

compass.addEventListener("mousedown", function(e){

    if(window.innerWidth <= 768){
        return;
    }

    dragging = true;

    compass.style.cursor="grabbing";

    offsetX = e.clientX - compass.offsetLeft;
    offsetY = e.clientY - compass.offsetTop;

});


document.addEventListener("mousemove", function(e){

    if(window.innerWidth <= 768){
        return;
    }

    if(!dragging) return;


    compass.style.left =
    (e.clientX - offsetX) + "px";


    compass.style.top =
    (e.clientY - offsetY) + "px";

});


document.addEventListener("mouseup", function(){

    if(window.innerWidth <= 768){
        return;
    }

    dragging=false;

    compass.style.cursor="grab";

});

var timeSlider = document.getElementById("sunTimeSlider");

var draggingTime = false;

var startX = 0;

var startHour = 0;


timeSlider.addEventListener("mousedown", function(e){

    draggingTime = true;

    startX = e.clientX;

    startHour = parseInt(timeSlider.value);

});


document.addEventListener("mousemove", function(e){

    if(!draggingTime) return;


    var movement = e.clientX - startX;


    var hourChange = Math.round(movement / 50);


    var newHour = startHour + hourChange;


    if(newHour < 4){
        newHour = 4;
    }


    if(newHour > 22){
        newHour = 22;
    }


    timeSlider.value = newHour;


    document.getElementById("selectedTime").innerHTML =
    newHour + ":00";


    updateSunCompass();

    updateSpotLighting();

    renderSidebar();


});


document.addEventListener("mouseup", function(){

});

function searchAirports(){

    var input = document.getElementById("airportSearch");

    var search = input.value.toLowerCase();

    var results = document.getElementById("searchResults");

    if(search.length < 2){

        results.innerHTML = "";
        results.style.display = "none";

        return;

    }

    var matches = airports.filter(function(airport){

    return (

        (airport.name || "").toLowerCase().includes(search)

        ||

        (airport.location || "").toLowerCase().includes(search)

        ||

        (airport.code || "").toLowerCase().includes(search)

        ||

        (airport.icao || "").toLowerCase().includes(search)

    );

});

results.innerHTML = matches.map(function(airport){

    return `
    <div class="searchResult"
    onclick="selectAirport('${airport.icao}')">

        <b>${airport.name}</b><br>
        ${airport.code} • ${airport.location}

    </div>
    `;

}).join("");

results.style.display = matches.length ? "block" : "none";

}
