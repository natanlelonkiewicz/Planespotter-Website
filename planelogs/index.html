<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plane Log | Avspot</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            background:#111;
            color:#fff;
            font-family:Arial, sans-serif;
        }

        .plane-log-page{
            max-width:1100px;
            margin:0 auto;
            padding:40px 20px;
        }

        .plane-log-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:10px;
        }

        .plane-log-header h1{
            margin:0;
            color:#f5c542;
            font-size:32px;
        }

        .back-button{
            background:#252525;
            color:#fff;
            border:1px solid #444;
            padding:10px 16px;
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
        }

        .back-button:hover{
            border-color:#f5c542;
        }

        .plane-log-subtitle{
            color:#aaa;
            margin-top:5px;
            margin-bottom:30px;
        }

        .plane-log-card{
            background:#1b1b1b;
            border:1px solid #333;
            border-radius:12px;
            padding:25px;
            margin-bottom:25px;
        }

        .plane-log-card h2{
            margin-top:0;
        }

        .log-aircraft-button{
            background:#f5c542;
            color:#111;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            font-weight:bold;
            cursor:pointer;
        }

        .log-aircraft-button:hover{
            opacity:0.9;
        }

        #planeLogEntries{
            margin-top:20px;
        }

        .empty-log{
            color:#888;
            text-align:center;
            padding:40px 10px;
        }

        #planeLogForm input,
#planeLogForm textarea{
    width:100%;
    max-width:600px;
    padding:12px;
    margin-top:10px;
    background:#111;
    color:#fff;
    border:1px solid #444;
    border-radius:8px;
    font-size:15px;
    font-family:Arial, sans-serif;
}

#planeLogForm textarea{
    min-height:100px;
    resize:vertical;
}

#planeLogForm input:focus,
#planeLogForm textarea:focus{
    outline:none;
    border-color:#f5c542;
}

#planePhotos{
    padding:10px;
    cursor:pointer;
}

#planeLogForm button{
    margin-top:10px;
    margin-right:8px;
}

.plane-log-entry{
    background:#151515;
    border:1px solid #333;
    border-radius:10px;
    padding:20px;
    margin-bottom:15px;
}

.plane-log-entry h3{
    color:#f5c542;
    margin-top:0;
    margin-bottom:15px;
    font-size:22px;
}

.plane-log-entry p{
    margin:7px 0;
    color:#ddd;
}

.plane-log-photos{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-top:18px;
}

.plane-log-photo{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid #333;
    display:block;
    cursor:pointer;
}

.plane-log-photo:hover{
    opacity:0.85;
}

.plane-log-photo-wrapper{
    position:relative;
}

.plane-log-photo-remove{
    position:absolute;
    top:8px;
    right:8px;
    width:30px;
    height:30px;
    border:none;
    border-radius:50%;
    background:#4a1f1f;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.plane-log-photo-remove:hover{
    background:#6b2929;
}

@media(max-width:700px){

    .plane-log-photos{
        grid-template-columns:repeat(2, 1fr);
    }

    .plane-log-photo{
        height:140px;
    }

}

@media(max-width:450px){

    .plane-log-photos{
        grid-template-columns:1fr;
    }

    .plane-log-photo{
        height:200px;
    }

}

.plane-log-controls{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.plane-log-edit,
.plane-log-delete{
    border:none;
    padding:9px 15px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.plane-log-edit{
    background:#333;
    color:#fff;
}

.plane-log-edit:hover{
    background:#444;
}

.plane-log-delete{
    background:#4a1f1f;
    color:#fff;
}

.plane-log-delete:hover{
    background:#6b2929;
}

    </style>

</head>


<body>


<div class="plane-log-page">


    <div class="plane-log-header">

        <h1>📋 Plane Log</h1>

        <button
            class="back-button"
            onclick="window.location.href='/'"
        >
            ← Back to Avspot
        </button>

    </div>


    <p class="plane-log-subtitle">
        Keep track of every aircraft you spot.
    </p>


    <div class="plane-log-card">

        <h2>Your Aircraft</h2>

        <p>
            Start building your personal aircraft spotting log.
        </p>

        <button
            class="log-aircraft-button"
            onclick="showPlaneLogForm()"
        >
            ➕ Log Aircraft
        </button>

    </div>


    <div
    id="planeLogForm"
    class="plane-log-card"
    style="display:none;"
>

    <h2 id="planeLogFormTitle">
    Log Aircraft
</h2>

    <input
        id="planeRegistration"
        type="text"
        placeholder="Registration (e.g. G-ABCD)"
    >

    <input
        id="planeAircraftType"
        type="text"
        placeholder="Aircraft type (e.g. A320-214)"
    >

    <input
        id="planeAirline"
        type="text"
        placeholder="Airline / Operator"
    >

    <input
        id="planeFlightNumber"
        type="text"
        placeholder="Flight number (optional)"
    >

    <input
        id="planeAirport"
        type="text"
        placeholder="Airport"
    >

    <input
        id="planeLocation"
        type="text"
        placeholder="Spotting location (optional)"
    >

    <input
        id="planeDate"
        type="date"
    >

    <input
        id="planeTime"
        type="time"
    >

    <textarea
        id="planeNotes"
        placeholder="Notes (optional)"
    ></textarea>

    <br><br>

    <label
    for="planePhotos"
    style="
        display:block;
        margin-top:15px;
        margin-bottom:8px;
        font-weight:bold;
    "
>
    📷 Photos
</label>

<input
    id="planePhotos"
    type="file"
    accept="image/*"
    multiple
>

<p
    style="
        color:#888;
        font-size:13px;
        margin-top:6px;
    "
>
    Upload up to 3 photos per sighting.
</p>

    <button
        type="button"
        class="log-aircraft-button"
        onclick="savePlaneLog()"
    >
        Save Aircraft
    </button>

    <button
        type="button"
        class="back-button"
        onclick="hidePlaneLogForm()"
    >
        Cancel
    </button>

</div>


    <div class="plane-log-card">

        <h2>Your Log</h2>

        <div id="planeLogEntries">

            <div class="empty-log">
                No aircraft logged yet.
            </div>

        </div>

    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL = "https://tfshpcjfcibynsbdxztn.supabase.co";
const SUPABASE_KEY = "sb_publishable_97SyMugx0LKqTgE7RjI8lw_UPHD7Wfl";

window.supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function showPlaneLogForm(){

    document.getElementById(
        "planeLogForm"
    ).style.display = "block";

}

function hidePlaneLogForm(){

    document.getElementById(
        "planeLogForm"
    ).style.display = "none";

}

async function editPlaneLog(logId){

    try{

        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();


        if(userError || !user){

            alert(
                "Please log in before editing a sighting."
            );

            return;

        }


        const {
            data: log,
            error
        } = await supabaseClient
            .from("plane_logs")
            .select("*")
            .eq("id", logId)
            .eq("user_id", user.id)
            .single();


        if(error){

            console.error(
                "Plane log fetch error:",
                error
            );

            alert(
                "Unable to load this aircraft log."
            );

            return;

        }


        document.getElementById(
            "planeLogForm"
        ).style.display = "block";


        document.getElementById(
            "planeLogFormTitle"
        ).textContent =
            "Edit Aircraft";


        document.getElementById(
            "planeRegistration"
        ).value =
            log.registration || "";


        document.getElementById(
            "planeAircraftType"
        ).value =
            log.aircraft_type || "";


        document.getElementById(
            "planeAirline"
        ).value =
            log.airline || "";


        document.getElementById(
            "planeFlightNumber"
        ).value =
            log.flight_number || "";


        document.getElementById(
            "planeAirport"
        ).value =
            log.airport || "";


        document.getElementById(
            "planeLocation"
        ).value =
            log.location || "";


        document.getElementById(
            "planeDate"
        ).value =
            log.sighting_date || "";


        document.getElementById(
            "planeTime"
        ).value =
            log.sighting_time || "";


        document.getElementById(
            "planeNotes"
        ).value =
            log.notes || "";


        window.editingPlaneLogId =
            logId;


        window.editingPlaneLogPhotos =
            log.photo_urls || [];


        const saveButton =
            document.querySelector(
                '#planeLogForm .log-aircraft-button'
            );


        if(saveButton){

            saveButton.textContent =
                "Save Changes";

        }


        document.getElementById(
            "planeLogForm"
        ).scrollIntoView({
            behavior:"smooth"
        });

    }

    catch(error){

        console.error(
            "Edit plane log error:",
            error
        );

        alert(
            "Something went wrong loading this aircraft."
        );

    }

}

async function savePlaneLog(){

    const editingId =
    window.editingPlaneLogId || null;

    const registration =
        document.getElementById("planeRegistration").value.trim();

    const aircraftType =
        document.getElementById("planeAircraftType").value.trim();

    const airline =
        document.getElementById("planeAirline").value.trim();

    const flightNumber =
        document.getElementById("planeFlightNumber").value.trim();

    const airportName =
        document.getElementById("planeAirport").value.trim();

    const location =
        document.getElementById("planeLocation").value.trim();

    const sightingDate =
        document.getElementById("planeDate").value;

    const sightingTime =
        document.getElementById("planeTime").value;

    const notes =
        document.getElementById("planeNotes").value.trim();

    const photoInput =
        document.getElementById("planePhotos");

    const photos =
        photoInput.files;


    // Make sure the user is logged in

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    if(userError || !user){

        alert(
            "Please log in before logging an aircraft."
        );

        return;

    }


    // Require registration

    if(!registration){

        alert(
            "Please enter the aircraft registration."
        );

        return;

    }


    // Maximum 3 photos

    if(photos.length > 3){

        alert(
            "You can upload a maximum of 3 photos."
        );

        return;

    }


    let photoUrls = [];

if(editingId){

    photoUrls =
        [...(window.editingPlaneLogPhotos || [])];

}


    try{

        if(
    editingId &&
    photoUrls.length + photos.length > 3
){

    alert(
        "You can have a maximum of 3 photos per sighting."
    );

    return;

}

        for(let i = 0; i < photos.length; i++){

            const file = photos[i];


            const fileExtension =
                file.name
                .split(".")
                .pop()
                .toLowerCase();


            const fileName =
                crypto.randomUUID()
                + "."
                + fileExtension;


            const filePath =
                user.id
                + "/"
                + fileName;


            const {
                error: uploadError
            } = await supabaseClient.storage
                .from("plane-log-photos")
                .upload(
                    filePath,
                    file
                );


            if(uploadError){

                console.error(
                    "Photo upload error:",
                    uploadError
                );

                throw uploadError;

            }


            photoUrls.push(filePath);

        }


                /*
            SAVE OR UPDATE PLANE LOG
        */

        let saveError;


        if(editingId){

            const {
                error
            } = await supabaseClient
                .from("plane_logs")
                .update({

                    registration:
                        registration,

                    aircraft_type:
                        aircraftType,

                    airline:
                        airline,

                    flight_number:
                        flightNumber,

                    airport:
                        airportName,

                    location:
                        location,

                    sighting_date:
                        sightingDate || null,

                    sighting_time:
                        sightingTime || null,

                    notes:
                        notes,

                    photo_urls:
                    photoUrls

                })
                .eq("id", editingId)
                .eq("user_id", user.id);


            saveError =
                error;

        }

        else{

            const {
                error
            } = await supabaseClient
                .from("plane_logs")
                .insert({

                    user_id:
                        user.id,

                    registration:
                        registration,

                    aircraft_type:
                        aircraftType,

                    airline:
                        airline,

                    flight_number:
                        flightNumber,

                    airport:
                        airportName,

                    location:
                        location,

                    sighting_date:
                        sightingDate || null,

                    sighting_time:
                        sightingTime || null,

                    notes:
                        notes,

                    photo_urls:
                        photoUrls

                });


            saveError =
                error;

        }


        if(saveError){

            console.error(
                "Plane log save error:",
                saveError
            );

            throw saveError;

        }


        alert(
    editingId
    ? "Aircraft updated successfully!"
    : "Aircraft logged successfully!"
);


        /*
            CLEAR FORM
        */

        document.getElementById(
            "planeRegistration"
        ).value = "";

        document.getElementById(
            "planeAircraftType"
        ).value = "";

        document.getElementById(
            "planeAirline"
        ).value = "";

        document.getElementById(
            "planeFlightNumber"
        ).value = "";

        document.getElementById(
            "planeAirport"
        ).value = "";

        document.getElementById(
            "planeLocation"
        ).value = "";

        document.getElementById(
            "planeDate"
        ).value = "";

        document.getElementById(
            "planeTime"
        ).value = "";

        document.getElementById(
            "planeNotes"
        ).value = "";

        photoInput.value = "";


        hidePlaneLogForm();

        window.editingPlaneLogId = null;
window.editingPlaneLogPhotos = [];


    }

    catch(error){

        console.error(
            "Plane log error:",
            error
        );

        alert(
            "Unable to save aircraft. Please try again."
        );

    }

}

async function deletePlaneLog(logId){

    const confirmed =
        confirm(
            "Are you sure you want to delete this aircraft sighting?\n\nAny photos attached to this sighting will also be deleted."
        );


    if(!confirmed){
        return;
    }


    try{

        /*
            Get the logged-in user
        */

        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();


        if(userError || !user){

            alert(
                "Please log in before deleting a sighting."
            );

            return;

        }


        /*
            Get the log first
            so we know which photos belong to it
        */

        const {
            data: log,
            error: fetchError
        } = await supabaseClient
            .from("plane_logs")
            .select("photo_urls")
            .eq("id", logId)
            .eq("user_id", user.id)
            .single();


        if(fetchError){

            console.error(
                "Plane log fetch error:",
                fetchError
            );

            alert(
                "Unable to find this aircraft log."
            );

            return;

        }


        /*
            Delete photos from Storage
        */

        if(
            log.photo_urls &&
            log.photo_urls.length > 0
        ){

            const {
                error: storageError
            } = await supabaseClient.storage
                .from("plane-log-photos")
                .remove(
                    log.photo_urls
                );


            if(storageError){

                console.error(
                    "Photo deletion error:",
                    storageError
                );

                alert(
                    "The aircraft log was not deleted because its photos could not be removed."
                );

                return;

            }

        }


        /*
            Delete database row
        */

        const {
            error: deleteError
        } = await supabaseClient
            .from("plane_logs")
            .delete()
            .eq("id", logId)
            .eq("user_id", user.id);


        if(deleteError){

            console.error(
                "Plane log deletion error:",
                deleteError
            );

            alert(
                "Unable to delete aircraft log."
            );

            return;

        }


        /*
            Refresh the log
        */

        await loadPlaneLogs();


    }

    catch(error){

        console.error(
            "Delete plane log error:",
            error
        );

        alert(
            "Something went wrong deleting this aircraft log."
        );

    }

}

async function loadPlaneLogs(){

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    if(userError || !user){

        document.getElementById(
            "planeLogEntries"
        ).innerHTML = `
            <div class="empty-log">
                Please log in to view your aircraft log.
            </div>
        `;

        return;

    }


    const {
        data: logs,
        error
    } = await supabaseClient
        .from("plane_logs")
        .select("*")
        .eq("user_id", user.id)
        .order("sighting_date", {
            ascending: false
        });


    if(error){

        console.error(
            "Plane log loading error:",
            error
        );

        return;

    }


    const container =
        document.getElementById(
            "planeLogEntries"
        );


    if(!logs || logs.length === 0){

        container.innerHTML = `
            <div class="empty-log">
                No aircraft logged yet.
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    logs.forEach(async function(log){

        const card =
            document.createElement("div");

        card.className =
            "plane-log-entry";

            card.dataset.logId =
    log.id;


        card.innerHTML = `

            <h3>
                ${log.registration || "Unknown registration"}
            </h3>

            <p>
                <strong>Aircraft:</strong>
                ${log.aircraft_type || "Unknown"}
            </p>

            <p>
                <strong>Airline:</strong>
                ${log.airline || "Unknown"}
            </p>

            <p>
                <strong>Flight:</strong>
                ${log.flight_number || "—"}
            </p>

            <p>
                <strong>Airport:</strong>
                ${log.airport || "—"}
            </p>

            <p>
                <strong>Location:</strong>
                ${log.location || "—"}
            </p>

            <p>
                <strong>Date:</strong>
                ${log.sighting_date || "—"}
            </p>

            <p>
                <strong>Time:</strong>
                ${log.sighting_time || "—"}
            </p>

            ${
                log.notes
                ?
                `
                <p>
                    <strong>Notes:</strong>
                    ${log.notes}
                </p>
                `
                :
                ""
            }

                        
            <div class="plane-log-controls">

    <button
        class="plane-log-edit"
        onclick="editPlaneLog('${log.id}')"
    >
        ✏️ Edit
    </button>

    <button
        class="plane-log-delete"
        onclick="deletePlaneLog('${log.id}')"
    >
        🗑 Delete
    </button>

</div>

                `;


        if(log.photo_urls && log.photo_urls.length > 0){

            const photoContainer =
                document.createElement("div");

            photoContainer.className =
                "plane-log-photos";


            for(const photoPath of log.photo_urls){

    const {
        data: photoData,
        error: photoError
    } = await supabaseClient.storage
        .from("plane-log-photos")
        .createSignedUrl(
            photoPath,
            3600
        );


    if(photoError){

        console.error(
            "Photo URL error:",
            photoError
        );

        continue;

    }


    const img =
        document.createElement("img");


    img.src =
        photoData.signedUrl;


    img.alt =
        log.registration || "Aircraft photo";


    img.className =
        "plane-log-photo";


        photoContainer.appendChild(img);

        }

        card.appendChild(photoContainer);

    }

    container.appendChild(card);

    });

}

loadPlaneLogs();

</script>


</body>

</html>
