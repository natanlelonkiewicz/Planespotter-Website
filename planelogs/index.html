<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plane Log | Avspot</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            background:#111;
            color:#fff;
            font-family:Arial, sans-serif;
        }

        .plane-log-page{
            max-width:1100px;
            margin:0 auto;
            padding:40px 20px;
        }

        .plane-log-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:10px;
        }

        .plane-log-header h1{
            margin:0;
            color:#f5c542;
            font-size:32px;
        }

        .back-button{
            background:#252525;
            color:#fff;
            border:1px solid #444;
            padding:10px 16px;
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
        }

        .back-button:hover{
            border-color:#f5c542;
        }

        .plane-log-subtitle{
            color:#aaa;
            margin-top:5px;
            margin-bottom:30px;
        }

        .plane-log-card{
            background:#1b1b1b;
            border:1px solid #333;
            border-radius:12px;
            padding:25px;
            margin-bottom:25px;
        }

        .plane-log-card h2{
            margin-top:0;
        }

        .log-aircraft-button{
            background:#f5c542;
            color:#111;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            font-weight:bold;
            cursor:pointer;
        }

        .log-aircraft-button:hover{
            opacity:0.9;
        }

        #planeLogEntries{
            margin-top:20px;
        }

        .empty-log{
            color:#888;
            text-align:center;
            padding:40px 10px;
        }

        #planeLogForm input,
#planeLogForm textarea{
    width:100%;
    max-width:600px;
    padding:12px;
    margin-top:10px;
    background:#111;
    color:#fff;
    border:1px solid #444;
    border-radius:8px;
    font-size:15px;
    font-family:Arial, sans-serif;
}

#planeLogForm textarea{
    min-height:100px;
    resize:vertical;
}

#planeLogForm input:focus,
#planeLogForm textarea:focus{
    outline:none;
    border-color:#f5c542;
}

#planePhotos{
    padding:10px;
    cursor:pointer;
}

#planeLogForm button{
    margin-top:10px;
    margin-right:8px;
}

    </style>

</head>


<body>


<div class="plane-log-page">


    <div class="plane-log-header">

        <h1>📋 Plane Log</h1>

        <button
            class="back-button"
            onclick="window.location.href='/'"
        >
            ← Back to Avspot
        </button>

    </div>


    <p class="plane-log-subtitle">
        Keep track of every aircraft you spot.
    </p>


    <div class="plane-log-card">

        <h2>Your Aircraft</h2>

        <p>
            Start building your personal aircraft spotting log.
        </p>

        <button
            class="log-aircraft-button"
            onclick="showPlaneLogForm()"
        >
            ➕ Log Aircraft
        </button>

    </div>


    <div
    id="planeLogForm"
    class="plane-log-card"
    style="display:none;"
>

    <h2>Log Aircraft</h2>

    <input
        id="planeRegistration"
        type="text"
        placeholder="Registration (e.g. G-ABCD)"
    >

    <input
        id="planeAircraftType"
        type="text"
        placeholder="Aircraft type (e.g. A320-214)"
    >

    <input
        id="planeAirline"
        type="text"
        placeholder="Airline / Operator"
    >

    <input
        id="planeFlightNumber"
        type="text"
        placeholder="Flight number (optional)"
    >

    <input
        id="planeAirport"
        type="text"
        placeholder="Airport"
    >

    <input
        id="planeLocation"
        type="text"
        placeholder="Spotting location (optional)"
    >

    <input
        id="planeDate"
        type="date"
    >

    <input
        id="planeTime"
        type="time"
    >

    <textarea
        id="planeNotes"
        placeholder="Notes (optional)"
    ></textarea>

    <br><br>

    <label
    for="planePhotos"
    style="
        display:block;
        margin-top:15px;
        margin-bottom:8px;
        font-weight:bold;
    "
>
    📷 Photos
</label>

<input
    id="planePhotos"
    type="file"
    accept="image/*"
    multiple
>

<p
    style="
        color:#888;
        font-size:13px;
        margin-top:6px;
    "
>
    Upload up to 3 photos per sighting.
</p>

    <button
        type="button"
        class="log-aircraft-button"
        onclick="savePlaneLog()"
    >
        Save Aircraft
    </button>

    <button
        type="button"
        class="back-button"
        onclick="hidePlaneLogForm()"
    >
        Cancel
    </button>

</div>


    <div class="plane-log-card">

        <h2>Your Log</h2>

        <div id="planeLogEntries">

            <div class="empty-log">
                No aircraft logged yet.
            </div>

        </div>

    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL = "https://tfshpcjfcibynsbdxztn.supabase.co";
const SUPABASE_KEY = "sb_publishable_97SyMugx0LKqTgE7RjI8lw_UPHD7Wfl";

window.supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function showPlaneLogForm(){

    document.getElementById(
        "planeLogForm"
    ).style.display = "block";

}

async function savePlaneLog(){

    const registration =
        document.getElementById("planeRegistration").value.trim();

    const aircraftType =
        document.getElementById("planeAircraftType").value.trim();

    const airline =
        document.getElementById("planeAirline").value.trim();

    const flightNumber =
        document.getElementById("planeFlightNumber").value.trim();

    const airportName =
        document.getElementById("planeAirport").value.trim();

    const location =
        document.getElementById("planeLocation").value.trim();

    const sightingDate =
        document.getElementById("planeDate").value;

    const sightingTime =
        document.getElementById("planeTime").value;

    const notes =
        document.getElementById("planeNotes").value.trim();

    const photoInput =
        document.getElementById("planePhotos");

    const photos =
        photoInput.files;


    // Make sure the user is logged in

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    if(userError || !user){

        alert(
            "Please log in before logging an aircraft."
        );

        return;

    }


    // Require registration

    if(!registration){

        alert(
            "Please enter the aircraft registration."
        );

        return;

    }


    // Maximum 3 photos

    if(photos.length > 3){

        alert(
            "You can upload a maximum of 3 photos."
        );

        return;

    }


    const photoUrls = [];


    try{

        /*
            UPLOAD PHOTOS
        */

        for(let i = 0; i < photos.length; i++){

            const file = photos[i];


            const fileExtension =
                file.name
                .split(".")
                .pop()
                .toLowerCase();


            const fileName =
                crypto.randomUUID()
                + "."
                + fileExtension;


            const filePath =
                user.id
                + "/"
                + fileName;


            const {
                error: uploadError
            } = await supabaseClient.storage
                .from("plane-log-photos")
                .upload(
                    filePath,
                    file
                );


            if(uploadError){

                console.error(
                    "Photo upload error:",
                    uploadError
                );

                throw uploadError;

            }


            photoUrls.push(filePath);

        }


        /*
            SAVE PLANE LOG
        */

        const {
            error: insertError
        } = await supabaseClient
            .from("plane_logs")
            .insert({

                user_id:
                    user.id,

                registration:
                    registration,

                aircraft_type:
                    aircraftType,

                airline:
                    airline,

                flight_number:
                    flightNumber,

                airport:
                    airportName,

                location:
                    location,

                sighting_date:
                    sightingDate || null,

                sighting_time:
                    sightingTime || null,

                notes:
                    notes,

                photo_urls:
                    photoUrls

            });


        if(insertError){

            console.error(
                "Plane log save error:",
                insertError
            );

            throw insertError;

        }


        alert(
            "Aircraft logged successfully!"
        );


        /*
            CLEAR FORM
        */

        document.getElementById(
            "planeRegistration"
        ).value = "";

        document.getElementById(
            "planeAircraftType"
        ).value = "";

        document.getElementById(
            "planeAirline"
        ).value = "";

        document.getElementById(
            "planeFlightNumber"
        ).value = "";

        document.getElementById(
            "planeAirport"
        ).value = "";

        document.getElementById(
            "planeLocation"
        ).value = "";

        document.getElementById(
            "planeDate"
        ).value = "";

        document.getElementById(
            "planeTime"
        ).value = "";

        document.getElementById(
            "planeNotes"
        ).value = "";

        photoInput.value = "";


        hidePlaneLogForm();


    }

    catch(error){

        console.error(
            "Plane log error:",
            error
        );

        alert(
            "Unable to save aircraft. Please try again."
        );

    }

}

</script>


</body>

</html>
